<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>記帳史萊姆首頁 · B 版（左側次導覽）</title>
<style>
  :root{
    --bg:#f6f1ea;
    --panel:#fffdfa;
    --ink:#3a352f;
    --ink-soft:#928c80;
    --line:#eae3d7;
    --accent-money:#c98a4b;
    --accent-food:#e07856;
    --accent-body:#4f9d8a;
    --accent-exercise:#5c86c9;
    --accent-diary:#b06a9e;
    --shadow-out: 8px 8px 18px #e8e1d4, -8px -8px 18px #ffffff;
    --shadow-in: inset 4px 4px 10px #e8e1d4, inset -4px -4px 10px #ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Noto Sans TC","PingFang TC","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  .shell{display:flex;min-height:100vh;}

  .sidebar{
    width:220px;flex-shrink:0;padding:28px 16px;
    display:flex;flex-direction:column;gap:6px;
    opacity:0;animation:slideIn .6s ease forwards;
  }
  @keyframes slideIn{from{opacity:0;transform:translateX(-16px);}to{opacity:1;transform:translateX(0);}}
  .logo{font-weight:800;font-size:19px;margin:6px 10px 28px;display:flex;align-items:center;gap:8px;}
  .logo .mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--accent-money),var(--accent-food));}
  .nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--ink-soft);font-weight:600;font-size:14px;}
  .nav-item .icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;}
  .nav-item.active{color:var(--ink);background:var(--panel);box-shadow:var(--shadow-out);}
  .nav-item.active .icon{background:rgba(201,138,75,.15);box-shadow:var(--shadow-in);}

  /* 記帳專屬的次導覽：窄的圖示列 */
  .sub-rail{
    width:76px;flex-shrink:0;padding:28px 0;
    display:flex;flex-direction:column;align-items:center;gap:18px;
    border-left:1px solid var(--line);
    opacity:0;animation:slideIn .6s ease .05s forwards;
  }
  .sub-rail a{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    font-size:10px;font-weight:700;color:var(--ink-soft);
    width:56px;padding:8px 0;border-radius:14px;
  }
  .sub-rail a .ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .sub-rail a.current{color:var(--ink);}
  .sub-rail a.current .ic{background:var(--panel);box-shadow:var(--shadow-out);}
  .sub-rail a.battle .ic{
    width:52px;height:52px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent-food),#ff9f73);
    color:#fff;font-size:20px;
    box-shadow:0 10px 20px -8px rgba(224,120,86,.6);
  }

  main{flex:1;padding:32px 40px 60px;position:relative;}

  /* 統一資訊卡：返回、日期、預算、金幣、設定都收在同一張卡片 */
  .header-card{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--panel);box-shadow:var(--shadow-out);
    border-radius:20px;padding:18px 24px;margin-bottom:24px;
    opacity:0;animation:fadeUp .6s ease .05s forwards;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .header-card .left{display:flex;align-items:center;gap:16px;}
  .back-btn{
    display:flex;align-items:center;gap:6px;
    font-size:13px;font-weight:700;color:var(--ink-soft);
    background:var(--bg);border-radius:100px;padding:8px 14px;
  }
  .header-card .date-block .date{font-size:13px;color:var(--ink-soft);}
  .header-card .date-block .budget{font-size:15px;font-weight:800;margin-top:2px;}
  .header-card .date-block .budget span{color:var(--ink-soft);font-weight:600;font-size:13px;}
  .header-card .right{display:flex;align-items:center;gap:12px;}
  .add-entry-btn{
    display:flex;align-items:center;gap:6px;
    background:linear-gradient(135deg,var(--accent-money),#e0aa6f);
    color:#fff;border-radius:100px;padding:8px 16px;
    font-size:13px;font-weight:800;
    box-shadow:var(--shadow-out);
  }
  .gold-pill{
    display:flex;align-items:center;gap:6px;
    background:var(--bg);border-radius:100px;padding:8px 16px;
    font-size:13px;font-weight:800;color:var(--accent-money);
  }
  .icon-btn{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg);box-shadow:var(--shadow-in);
    font-size:15px;color:var(--ink-soft);
  }

  .content-grid{
    display:grid;grid-template-columns:1fr 340px;gap:24px;
    opacity:0;animation:fadeUp .6s ease .12s forwards;
  }

  .slime-card{
    background:var(--panel);box-shadow:var(--shadow-out);
    border-radius:24px;padding:32px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:460px;
  }
  .slime-placeholder{
    width:240px;height:240px;border-radius:50%;
    border:3px dashed var(--line);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);font-size:13px;text-align:center;line-height:1.6;
  }
  .slime-hint{margin-top:20px;font-size:13px;color:var(--ink-soft);text-align:center;}

  .side-panel{display:flex;flex-direction:column;gap:20px;}
  .panel-card{
    background:var(--panel);box-shadow:var(--shadow-out);
    border-radius:20px;padding:20px;
  }
  .panel-card .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .panel-card .head .title{font-size:13px;font-weight:800;color:var(--ink-soft);}
  .panel-tabs{display:flex;gap:4px;}
  .panel-tabs button{
    border:none;background:var(--bg);font-family:inherit;
    padding:6px 10px;border-radius:100px;font-size:11px;font-weight:700;color:var(--ink-soft);cursor:pointer;
  }
  .panel-tabs button.active{background:var(--accent-body);color:#fff;}

  .period-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(79,157,138,.12);color:var(--accent-body);
    font-size:12px;font-weight:700;padding:5px 10px;border-radius:100px;margin-bottom:12px;
  }
  .period-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-body);}
  .period-range{font-size:12px;color:var(--ink-soft);margin-bottom:16px;}

  .stat-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;}
  .stat-row .name{width:56px;font-weight:700;flex-shrink:0;}
  .stat-track{flex:1;height:7px;border-radius:6px;box-shadow:var(--shadow-in);overflow:hidden;}
  .stat-track div{height:100%;border-radius:6px;}
  .stat-value{width:24px;text-align:right;font-weight:800;flex-shrink:0;}

  .wealth-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
    font-size:13px;font-weight:800;color:var(--accent-money);
  }

  .budget-card .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .budget-card .row b{font-size:18px;}
  .budget-track{height:9px;border-radius:8px;box-shadow:var(--shadow-in);overflow:hidden;}
  .budget-track div{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent-money),#e0aa6f);width:62%;}

  .treasure-fab{
    position:fixed;right:40px;bottom:40px;
    display:flex;align-items:center;gap:8px;
    background:linear-gradient(135deg,var(--accent-money),#e0aa6f);
    color:#fff;border-radius:100px;padding:14px 22px;
    box-shadow:0 14px 30px -10px rgba(201,138,75,.6);
    font-weight:800;font-size:14px;
  }

  footer.note{position:fixed;left:316px;bottom:16px;color:var(--ink-soft);font-size:12px;opacity:.7;}
</style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="logo"><span class="mark"></span>生活紀錄</div>
      <div class="nav-item active"><span class="icon">💰</span>記帳</div>
      <div class="nav-item"><span class="icon">🍱</span>飲食</div>
      <div class="nav-item"><span class="icon">⚖️</span>身體紀錄</div>
      <div class="nav-item"><span class="icon">🏃</span>運動</div>
      <div class="nav-item"><span class="icon">📔</span>日記</div>
    </aside>

    <nav class="sub-rail">
      <a class="current"><span class="ic">🟢</span>史萊姆</a>
      <a class="battle"><span class="ic">⚔️</span></a>
      <a><span class="ic">🛍️</span>商店</a>
      <a><span class="ic">📊</span>統計</a>
      <a><span class="ic">⚙️</span>設定</a>
    </nav>

    <main>
      <div class="header-card">
        <div class="left">
          <div class="back-btn">← 返回總覽</div>
          <div class="date-block">
            <div class="date">2026年9月23日・星期三</div>
            <div class="budget">$18,420 <span>/ 本月預算 $30,000</span></div>
          </div>
        </div>
        <div class="right">
          <div class="add-entry-btn">＋ 新增記帳</div>
          <div class="gold-pill">🪙 1,280</div>
          <div class="icon-btn">⚙️</div>
        </div>
      </div>

      <div class="content-grid">
        <div class="slime-card">
          <div class="slime-placeholder">史萊姆畫面<br />（開發中，先留空）</div>
          <div class="slime-hint">點擊可查看能力值與花費紀錄 → 詳見右側面板</div>
        </div>

        <div class="side-panel">
          <div class="panel-card">
            <div class="head">
              <span class="title">能力值分配</span>
              <div class="panel-tabs">
                <button class="active">能力值</button>
                <button>花費紀錄</button>
              </div>
            </div>
            <div class="period-badge"><span class="dot"></span>培育中</div>
            <div class="period-range">記帳區間：2026/09/17 － 2026/09/24</div>

            <div class="stat-row"><span class="name">力量</span><div class="stat-track"><div style="width:60%;background:var(--accent-food);"></div></div><span class="stat-value">12</span></div>
            <div class="stat-row"><span class="name">敏捷</span><div class="stat-track"><div style="width:40%;background:var(--accent-exercise);"></div></div><span class="stat-value">8</span></div>
            <div class="stat-row"><span class="name">運氣</span><div class="stat-track"><div style="width:25%;background:var(--accent-diary);"></div></div><span class="stat-value">5</span></div>
            <div class="stat-row"><span class="name">智力</span><div class="stat-track"><div style="width:75%;background:var(--accent-money);"></div></div><span class="stat-value">15</span></div>
            <div class="stat-row"><span class="name">體力</span><div class="stat-track"><div style="width:35%;background:var(--accent-body);"></div></div><span class="stat-value">7</span></div>

            <div class="wealth-row"><span>🪙 鈔能力</span><span>$3,200</span></div>
          </div>

          <div class="panel-card budget-card">
            <div class="row"><span style="font-size:13px;color:var(--ink-soft);font-weight:700;">本月總支出</span><b>$18,420</b></div>
            <div class="budget-track"><div></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="treasure-fab">🎁 領取寶藏</div>
  <footer class="note">示意圖 B・左側次導覽 ｜ 資訊整合成單一卡片，能力值面板預設顯示</footer>

<script>
  document.querySelectorAll('.panel-tabs button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const group = btn.closest('.panel-tabs');
      group.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
</script>
</body>
</html>
