<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生活紀錄 · Bold Dark Vibrant</title>
    <style>
      :root {
        --bg: #0e0f1a;
        --panel: #171927;
        --panel-2: #1e2133;
        --ink: #f2f2f7;
        --ink-soft: #8b8da3;
        --line: #2a2d42;
        --money: #a78bfa;
        --food: #ff8a5c;
        --body: #2dd4bf;
        --exercise: #38bdf8;
        --diary: #f472b6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          'Noto Sans TC', 'PingFang TC', 'Helvetica Neue', Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
      }
      .glow {
        position: fixed;
        border-radius: 50%;
        filter: blur(90px);
        z-index: 0;
        opacity: 0.35;
        animation: drift 16s ease-in-out infinite;
      }
      .glow1 {
        width: 460px;
        height: 460px;
        background: var(--money);
        top: -150px;
        left: -100px;
      }
      .glow2 {
        width: 420px;
        height: 420px;
        background: var(--exercise);
        bottom: -160px;
        right: -120px;
        animation-delay: 4s;
      }
      .glow3 {
        width: 300px;
        height: 300px;
        background: var(--diary);
        top: 35%;
        right: 20%;
        animation-delay: 8s;
      }
      @keyframes drift {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(40px, -30px);
        }
      }

      .app {
        position: relative;
        z-index: 1;
        max-width: 1140px;
        margin: 0 auto;
        padding: 30px 24px 90px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 26px;
        opacity: 0;
        animation: fadeIn 0.6s ease forwards;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .brand {
        font-weight: 800;
        font-size: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand .logo {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: conic-gradient(
          from 180deg,
          var(--money),
          var(--exercise),
          var(--diary),
          var(--money)
        );
        animation: spin 6s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .user-chip {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 6px 14px 6px 6px;
        border-radius: 100px;
      }
      .user-chip .av {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--money), var(--diary));
      }
      .user-chip span {
        font-size: 13px;
        color: var(--ink-soft);
      }

      /* bottom-style nav rendered at top for desktop */
      nav.tabs {
        display: flex;
        gap: 8px;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 8px;
        border-radius: 20px;
        margin-bottom: 30px;
        position: relative;
        opacity: 0;
        animation: fadeIn 0.6s ease 0.1s forwards;
        overflow-x: auto;
      }
      nav.tabs button {
        flex: 1;
        min-width: 100px;
        border: none;
        background: transparent;
        color: var(--ink-soft);
        font-family: inherit;
        font-weight: 700;
        font-size: 13px;
        padding: 12px 10px;
        border-radius: 14px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      nav.tabs button .ic {
        font-size: 17px;
        filter: grayscale(1);
        opacity: 0.6;
        transition: all 0.3s ease;
      }
      nav.tabs button.active {
        color: #fff;
        background: var(--panel-2);
        box-shadow:
          inset 0 0 0 1px var(--line),
          0 0 24px -8px var(--glow, var(--money));
      }
      nav.tabs button.active .ic {
        filter: none;
        opacity: 1;
        transform: scale(1.1);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 18px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 22px;
        position: relative;
        overflow: hidden;
        opacity: 0;
        transform: translateY(22px);
        animation: cardIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        transition:
          transform 0.3s ease,
          border-color 0.3s ease;
      }
      .card::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: 20px;
        padding: 1px;
        background: linear-gradient(135deg, var(--tint), transparent 60%);
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0.6;
        pointer-events: none;
      }
      .card:hover {
        transform: translateY(-6px);
        border-color: transparent;
      }
      .card:nth-child(1) {
        animation-delay: 0.15s;
        --tint: var(--money);
      }
      .card:nth-child(2) {
        animation-delay: 0.22s;
        --tint: var(--food);
      }
      .card:nth-child(3) {
        animation-delay: 0.29s;
        --tint: var(--body);
      }
      .card:nth-child(4) {
        animation-delay: 0.36s;
        --tint: var(--exercise);
      }
      .card:nth-child(5) {
        animation-delay: 0.43s;
        --tint: var(--diary);
      }
      .card:nth-child(6) {
        animation-delay: 0.5s;
        --tint: var(--exercise);
      }
      @keyframes cardIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .card-title {
        font-size: 12px;
        color: var(--ink-soft);
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .card-icon {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        background: color-mix(in srgb, var(--tint) 18%, transparent);
      }
      .card-value {
        font-size: 27px;
        font-weight: 800;
        margin-bottom: 14px;
      }
      .card-value small {
        font-size: 12px;
        color: var(--ink-soft);
        font-weight: 600;
      }

      .track {
        height: 8px;
        border-radius: 6px;
        background: var(--panel-2);
        overflow: hidden;
      }
      .track-fill {
        height: 100%;
        border-radius: 6px;
        width: 0;
        background: linear-gradient(90deg, var(--tint), #fff2);
        transition: width 1.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        box-shadow: 0 0 14px var(--tint);
      }

      .sparkline path {
        filter: drop-shadow(0 0 6px var(--tint));
      }

      .ring-wrap {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .ring {
        width: 64px;
        height: 64px;
        transform: rotate(-90deg);
      }
      .ring circle {
        fill: none;
        stroke-width: 7;
      }
      .ring .bg {
        stroke: var(--panel-2);
      }
      .ring .fg {
        stroke: var(--exercise);
        stroke-linecap: round;
        stroke-dasharray: 170;
        stroke-dashoffset: 170;
        animation: ringFill 1.5s 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        filter: drop-shadow(0 0 6px var(--exercise));
      }
      @keyframes ringFill {
        to {
          stroke-dashoffset: 48;
        }
      }

      .mood-strip {
        display: flex;
        gap: 8px;
        margin: 6px 0 12px;
      }
      .mood-strip span {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--panel-2);
        opacity: 0.4;
        font-size: 14px;
      }
      .mood-strip span.active {
        opacity: 1;
        box-shadow:
          0 0 0 2px var(--diary),
          0 0 16px var(--diary);
      }
      .quote {
        font-size: 13px;
        color: var(--ink-soft);
        line-height: 1.6;
        border-left: 2px solid var(--diary);
        padding-left: 10px;
      }

      .water-card .liquid-wrap {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .cup {
        width: 52px;
        height: 70px;
        border: 2px solid color-mix(in srgb, var(--exercise) 60%, transparent);
        border-top: none;
        border-radius: 0 0 14px 14px;
        position: relative;
        overflow: hidden;
      }
      .cup .water {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 0;
        background: linear-gradient(180deg, var(--exercise), #0ea5e9);
        box-shadow: 0 0 20px var(--exercise) inset;
        animation: fillUp 1.6s 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      @keyframes fillUp {
        to {
          height: 65%;
        }
      }

      .streak-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--ink-soft);
        background: var(--panel-2);
        padding: 6px 12px;
        border-radius: 100px;
        margin-bottom: 10px;
      }
      .streak-badge .flame {
        animation: flick 1.5s infinite;
      }
      @keyframes flick {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
        }
      }

      footer.note {
        text-align: center;
        color: var(--ink-soft);
        font-size: 12px;
        margin-top: 40px;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="glow glow1"></div>
    <div class="glow glow2"></div>
    <div class="glow glow3"></div>

    <div class="app">
      <header>
        <div class="brand"><span class="logo"></span>生活紀錄</div>
        <div class="user-chip">
          <span class="av"></span><span>Fei・連續使用 21 天</span>
        </div>
      </header>

      <nav class="tabs" id="tabs">
        <button class="active" data-glow="#a78bfa">
          <span class="ic">🏠</span>總覽
        </button>
        <button data-glow="#a78bfa"><span class="ic">💰</span>記帳</button>
        <button data-glow="#ff8a5c"><span class="ic">🍱</span>飲食</button>
        <button data-glow="#2dd4bf"><span class="ic">⚖️</span>身體紀錄</button>
        <button data-glow="#38bdf8"><span class="ic">🏃</span>運動</button>
        <button data-glow="#f472b6"><span class="ic">📔</span>日記</button>
      </nav>

      <section class="grid">
        <div class="card">
          <div class="card-head">
            <div class="card-title">本月記帳</div>
            <div class="card-icon">💰</div>
          </div>
          <div class="card-value">$18,420 <small>/ $25,000</small></div>
          <div class="track"><div class="track-fill" data-w="74%"></div></div>
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-title">今日飲食</div>
            <div class="card-icon">🍱</div>
          </div>
          <div class="card-value">1,340 <small>kcal / 2,000</small></div>
          <div class="track"><div class="track-fill" data-w="67%"></div></div>
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-title">身體紀錄</div>
            <div class="card-icon">⚖️</div>
          </div>
          <div class="card-value">62.4 <small>kg (-0.3)</small></div>
          <svg
            class="sparkline"
            width="100%"
            height="34"
            viewBox="0 0 200 34"
            preserveAspectRatio="none"
          >
            <path
              d="M0,24 30,20 60,22 90,13 120,16 150,8 180,10 200,4"
              fill="none"
              stroke="#2dd4bf"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-title">今日運動</div>
            <div class="card-icon">🏃</div>
          </div>
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 60 60">
              <circle class="bg" cx="30" cy="30" r="27" />
              <circle class="fg" cx="30" cy="30" r="27" />
            </svg>
            <div>
              <div class="card-value" style="margin: 0">
                6,240 <small>步</small>
              </div>
              <div class="card-title" style="text-transform: none">
                目標 8,000
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-title">日記</div>
            <div class="card-icon">📔</div>
          </div>
          <div class="streak-badge">
            <span class="flame">🔥</span>連續紀錄 12 天
          </div>
          <div class="mood-strip">
            <span>😔</span><span>😐</span><span class="active">😊</span
            ><span>😄</span><span>🤩</span>
          </div>
          <div class="quote">
            下班後去河堤跑了 3 公里，感覺身體慢慢找回節奏……
          </div>
        </div>

        <div class="card water-card">
          <div class="card-head">
            <div class="card-title">今日喝水</div>
            <div class="card-icon">💧</div>
          </div>
          <div class="liquid-wrap">
            <div class="cup"><div class="water"></div></div>
            <div class="card-value" style="margin: 0">
              1,300<small> / 2,000ml</small>
            </div>
          </div>
        </div>
      </section>

      <footer class="note">
        示意圖 C・Bold Dark Vibrant ｜ 深色底 + 霓虹漸層描邊 + 發光數據
      </footer>
    </div>

    <script>
      document.querySelectorAll('.track-fill').forEach((el) => {
        const w = el.getAttribute('data-w');
        setTimeout(() => (el.style.width = w), 350);
      });

      const buttons = document.querySelectorAll('#tabs button');
      buttons.forEach((btn) => {
        btn.addEventListener('click', () => {
          buttons.forEach((b) => {
            b.classList.remove('active');
          });
          btn.classList.add('active');
          document.documentElement.style.setProperty(
            '--glow',
            btn.dataset.glow,
          );
        });
      });
    </script>
  </body>
</html>
