<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登入 / 註冊 · B 版（分割畫面：全方位生活分類）</title>
<style>
  :root{
    --bg:#f6f1ea;
    --panel:#fffdfa;
    --ink:#3a352f;
    --ink-soft:#928c80;
    --line:#eae3d7;
    --accent-money:#c98a4b;
    --accent-food:#e07856;
    --accent-body:#4f9d8a;
    --accent-exercise:#5c86c9;
    --accent-diary:#b06a9e;
    --shadow-out: 8px 8px 18px #e8e1d4, -8px -8px 18px #ffffff;
    --shadow-in: inset 4px 4px 10px #e8e1d4, inset -4px -4px 10px #ffffff;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Sans TC","PingFang TC","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  .note{position:fixed;top:16px;left:16px;font-size:12px;color:var(--ink-soft);background:var(--panel);padding:8px 14px;border-radius:100px;box-shadow:var(--shadow-out);z-index:10;max-width:80vw;}

  .layout{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;}
  @media (max-width:860px){.layout{grid-template-columns:1fr;}.brand-panel{display:none;}}

  .brand-panel{
    background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:40px;
  }

  .orbit{position:relative;width:260px;height:260px;margin-bottom:36px;}
  .chip{
    position:absolute;width:62px;height:62px;border-radius:18px;background:var(--panel);box-shadow:var(--shadow-out);
    display:flex;align-items:center;justify-content:center;font-size:24px;animation:float 3.4s ease-in-out infinite;
  }
  .chip.c1{top:0;left:50%;margin-left:-31px;background:color-mix(in srgb, var(--accent-money) 14%, var(--panel));animation-delay:0s;}
  .chip.c2{top:34%;right:0;background:color-mix(in srgb, var(--accent-food) 14%, var(--panel));animation-delay:.5s;}
  .chip.c3{bottom:0;right:14%;background:color-mix(in srgb, var(--accent-exercise) 14%, var(--panel));animation-delay:1s;}
  .chip.c4{bottom:0;left:14%;background:color-mix(in srgb, var(--accent-body) 14%, var(--panel));animation-delay:1.5s;}
  .chip.c5{top:34%;left:0;background:color-mix(in srgb, var(--accent-diary) 14%, var(--panel));animation-delay:2s;}
  .chip.center{
    top:50%;left:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;
    background:var(--ink);color:#fff;font-size:14px;font-weight:800;text-align:center;line-height:1.3;animation:none;box-shadow:var(--shadow-out);
  }
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

  .headline{font-size:24px;font-weight:800;text-align:center;line-height:1.5;margin:0 0 10px;}
  .headline .accent{color:var(--accent-body);}
  .sub{font-size:13px;color:var(--ink-soft);text-align:center;max-width:280px;line-height:1.7;}

  .form-panel{display:flex;align-items:center;justify-content:center;padding:40px 24px;}
  .form-wrap{width:100%;max-width:360px;opacity:0;animation:fadeUp .5s ease forwards;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  h1{font-size:19px;margin:0 0 4px;}
  .subtitle{font-size:12.5px;color:var(--ink-soft);margin:0 0 26px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .field input{
    width:100%;font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);
    border:none;border-radius:13px;padding:12px 14px;box-shadow:var(--shadow-in);outline:none;transition:box-shadow .2s ease;
  }
  .field input:focus{box-shadow:0 0 0 2px var(--ink) inset;}

  .confirm-field{display:none;}
  .confirm-field.show{display:block;}

  .forgot{display:flex;justify-content:flex-end;margin:-4px 0 18px;}
  .forgot a{font-size:11.5px;color:var(--ink-soft);text-decoration:none;}
  .forgot a:hover{color:var(--ink);}

  .submit-btn{
    width:100%;border:none;border-radius:15px;padding:14px;font-family:inherit;font-size:14.5px;font-weight:800;
    color:#fff;background:var(--ink);box-shadow:var(--shadow-out);cursor:pointer;
    transition:transform .15s ease;margin-top:4px;
  }
  .submit-btn:active{transform:scale(.98);}

  .switch-hint{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:20px;}
  .switch-hint a{color:var(--ink);font-weight:700;text-decoration:none;cursor:pointer;}
</style>
</head>
<body>
<div class="note">B 版：左右分割，左邊用五個生活分類 chip（記帳/飲食/運動/身體/日記）環繞排列強調「全方位」，中間放文字 slogan，不用吉祥物；右邊表單，手機版自動收成單欄</div>

<div class="layout">
  <div class="brand-panel">
    <div class="orbit">
      <div class="chip c1">💰</div>
      <div class="chip c2">🍽️</div>
      <div class="chip c3">🏃</div>
      <div class="chip c4">💪</div>
      <div class="chip c5">📔</div>
      <div class="chip center">Life<br/>Record</div>
    </div>
    <div class="headline">生活大小事<br/><span class="accent">都靠我記事</span></div>
    <p class="sub">記帳、飲食、運動、身體紀錄、日記，一個地方全部記好記滿</p>
  </div>

  <div class="form-panel">
    <div class="form-wrap">
      <h1 id="title">歡迎回來</h1>
      <p class="subtitle" id="subtitle">登入繼續記錄你的生活</p>

      <div id="nameField" class="field confirm-field">
        <label>暱稱</label>
        <input type="text" placeholder="怎麼稱呼你" />
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" placeholder="you@example.com" />
      </div>

      <div class="field">
        <label>密碼</label>
        <input type="password" placeholder="至少 8 碼" />
      </div>

      <div id="confirmField" class="field confirm-field">
        <label>確認密碼</label>
        <input type="password" placeholder="再輸入一次" />
      </div>

      <div id="forgotRow" class="forgot">
        <a href="#">忘記密碼？</a>
      </div>

      <button class="submit-btn" id="submitBtn">登入</button>

      <div class="switch-hint" id="switchHint">
        還沒有帳號？<a id="switchLink">立即註冊</a>
      </div>
    </div>
  </div>
</div>

<script>
  const nameField = document.getElementById('nameField');
  const confirmField = document.getElementById('confirmField');
  const forgotRow = document.getElementById('forgotRow');
  const submitBtn = document.getElementById('submitBtn');
  const switchHint = document.getElementById('switchHint');
  const title = document.getElementById('title');
  const subtitle = document.getElementById('subtitle');

  function setMode(mode) {
    const isRegister = mode === 'register';
    nameField.classList.toggle('show', isRegister);
    confirmField.classList.toggle('show', isRegister);
    forgotRow.style.visibility = isRegister ? 'hidden' : 'visible';
    submitBtn.textContent = isRegister ? '建立帳號' : '登入';
    title.textContent = isRegister ? '加入我們' : '歡迎回來';
    subtitle.textContent = isRegister ? '建立帳號，開始記錄你的生活' : '登入繼續記錄你的生活';
    switchHint.innerHTML = isRegister
      ? '已經有帳號了？<a id="switchLink">直接登入</a>'
      : '還沒有帳號？<a id="switchLink">立即註冊</a>';
    document.getElementById('switchLink').addEventListener('click', () => setMode(isRegister ? 'login' : 'register'));
  }

  document.getElementById('switchLink').addEventListener('click', () => setMode('register'));
</script>
</body>
</html>
