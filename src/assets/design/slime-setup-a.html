<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>培育史萊姆設定 · A 版（清單型 modal）</title>
<style>
  :root{
    --bg:#f6f1ea;
    --panel:#fffdfa;
    --ink:#3a352f;
    --ink-soft:#928c80;
    --line:#eae3d7;
    --accent-money:#c98a4b;
    --accent-food:#e07856;
    --accent-body:#4f9d8a;
    --accent-exercise:#5c86c9;
    --accent-diary:#b06a9e;
    --shadow-out: 8px 8px 18px #e8e1d4, -8px -8px 18px #ffffff;
    --shadow-in: inset 4px 4px 10px #e8e1d4, inset -4px -4px 10px #ffffff;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Sans TC","PingFang TC","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  .note{position:fixed;top:16px;left:16px;font-size:12px;color:var(--ink-soft);background:var(--panel);padding:8px 14px;border-radius:100px;box-shadow:var(--shadow-out);z-index:10;max-width:80vw;}

  .overlay{position:fixed;inset:0;background:rgba(58,53,47,.4);display:flex;overflow-y:auto;padding:40px 16px;}
  .modal{
    margin:auto;width:100%;max-width:420px;background:var(--panel);border-radius:20px;
    box-shadow:0 20px 50px -12px rgba(58,53,47,.3);padding:28px 24px;position:relative;
    opacity:0;animation:fadeUp .5s ease forwards;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .close-btn{position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:50%;border:none;background:var(--bg);color:var(--ink-soft);box-shadow:var(--shadow-in);font-size:15px;cursor:pointer;}

  .egg{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--ink-soft);}
  h1{font-size:17px;text-align:center;margin:0 0 6px;}
  .subtitle{font-size:12.5px;color:var(--ink-soft);text-align:center;line-height:1.6;margin:0 0 22px;padding:0 8px;}

  .option-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .option{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:12px 14px;border-radius:14px;border:2px solid transparent;background:var(--bg);
    box-shadow:var(--shadow-in);cursor:pointer;font-family:inherit;
  }
  .option.selected{background:var(--panel);border-color:var(--accent-money);box-shadow:var(--shadow-out);}
  .option .ic{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;background:rgba(201,138,75,.14);color:var(--accent-money);}
  .option .label{font-size:13.5px;font-weight:800;}
  .option .desc{font-size:11px;color:var(--ink-soft);margin-top:1px;}
  .option .check{margin-left:auto;font-size:14px;color:var(--accent-money);opacity:0;}
  .option.selected .check{opacity:1;}

  .custom-days{display:none;align-items:center;gap:10px;padding:10px 14px 14px 64px;margin-top:-4px;}
  .custom-days.show{display:flex;}
  .custom-days input{width:70px;font-family:inherit;font-size:13px;text-align:center;border:none;border-radius:11px;padding:8px;box-shadow:var(--shadow-in);background:transparent;color:var(--ink);}
  .custom-days span{font-size:12px;color:var(--ink-soft);}

  .summary{background:var(--bg);border-radius:14px;padding:12px 16px;text-align:center;font-size:12px;color:var(--ink-soft);margin-bottom:18px;}
  .summary b{color:var(--ink);font-weight:800;}

  .start-btn{width:100%;border:none;border-radius:14px;padding:13px;font-family:inherit;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent-money),#e0aa6f);box-shadow:var(--shadow-out);cursor:pointer;}
</style>
</head>
<body>
<div class="note">A 版：跟現有 modal（AddEntryModal 等）同一套外殼，清單式選項，最貼近現有風格</div>

<div class="overlay">
  <div class="modal">
    <button class="close-btn" aria-label="關閉">✕</button>
    <div class="egg">🥚</div>
    <h1>培育新的史萊姆</h1>
    <p class="subtitle">選擇這次要培育多久，期間內的記帳都會即時反映在牠的能力值上</p>

    <div class="option-list" id="optionList">
      <button class="option" data-days="1">
        <span class="ic">⚡</span>
        <span>
          <span class="label" style="display:block;">1 天</span>
          <span class="desc">快速體驗一輪</span>
        </span>
        <span class="check">✓</span>
      </button>
      <button class="option" data-days="7">
        <span class="ic">📅</span>
        <span>
          <span class="label" style="display:block;">一週</span>
          <span class="desc">標準培育節奏</span>
        </span>
        <span class="check">✓</span>
      </button>
      <button class="option" data-days="30">
        <span class="ic">🗓️</span>
        <span>
          <span class="label" style="display:block;">一個月</span>
          <span class="desc">長期挑戰，能力值累積更多</span>
        </span>
        <span class="check">✓</span>
      </button>
      <button class="option" data-days="custom">
        <span class="ic">✏️</span>
        <span>
          <span class="label" style="display:block;">自訂天數</span>
          <span class="desc">自己決定要培育幾天</span>
        </span>
        <span class="check">✓</span>
      </button>
    </div>

    <div class="custom-days" id="customDays">
      <input type="number" min="1" value="14" id="customInput" />
      <span>天</span>
    </div>

    <div class="summary" id="summary">請選擇培育週期</div>

    <button class="start-btn">開始培育</button>
  </div>
</div>

<script>
  const options = document.querySelectorAll('.option');
  const customDaysEl = document.getElementById('customDays');
  const customInput = document.getElementById('customInput');
  const summaryEl = document.getElementById('summary');

  const fmt = (d) => `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;

  function updateSummary(days) {
    const start = new Date();
    const end = new Date();
    end.setDate(start.getDate() + Number(days));
    summaryEl.innerHTML = `培育區間：<b>${fmt(start)} － ${fmt(end)}</b>（${days} 天）`;
  }

  options.forEach(opt => {
    opt.addEventListener('click', () => {
      options.forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      const isCustom = opt.dataset.days === 'custom';
      customDaysEl.classList.toggle('show', isCustom);
      updateSummary(isCustom ? customInput.value : opt.dataset.days);
    });
  });
  customInput.addEventListener('input', () => updateSummary(customInput.value || 1));
</script>
</body>
</html>
